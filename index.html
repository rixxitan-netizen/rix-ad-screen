<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LG Store Advertisement</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#screen{width:100vw;height:100vh;object-fit:contain;display:block}
</style>
</head>
<body>
<img id="screen" src="ad1.jpg" alt="">
<script>
const ads = ["ad1.jpg","ad2.jpg","ad3.jpg","ad4.jpg"];
let i = 0;
function show(){
  document.getElementById("screen").src = ads[i] + "?v=" + Date.now();
}
show();
setInterval(()=>{ i=(i+1)%ads.length; show(); }, 10000);
setInterval(()=>location.reload(), 300000);
</script>
</body>
</html>
