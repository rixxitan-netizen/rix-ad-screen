<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIX Store Advertisement</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#screen{width:100vw;height:100vh;object-fit:contain;display:block}
</style>
</head>
<body>
<img id="screen" src="ad1.jpg" alt="Advertisement">
<script>
var ads=[];
for(var n=1;n<=20;n++){ads.push('ad'+n+'.jpg');}
var availableAds=[];
var currentIndex=0;
function checkImages(index){
  if(index>=ads.length){if(availableAds.length){startSlideshow();}return;}
  var image=new Image();
  image.onload=function(){availableAds.push(ads[index]);checkImages(index+1);};
  image.onerror=function(){checkImages(index+1);};
  image.src=ads[index]+'?check='+new Date().getTime();
}
function showImage(){
  if(!availableAds.length){return;}
  document.getElementById('screen').src=availableAds[currentIndex]+'?v='+new Date().getTime();
  currentIndex=(currentIndex+1)%availableAds.length;
}
function startSlideshow(){showImage();setInterval(showImage,40000);}
checkImages(0);
setInterval(function(){location.reload();},300000);
</script>
</body>
</html>
