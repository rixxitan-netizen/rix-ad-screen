<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RIX Store Advertisement</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden}
#screen{width:100vw;height:100vh;object-fit:contain;display:block}
</style>
</head>
<body>
<img id="screen" alt="Advertisement">
<script>
(function(){
  var maxAds = 20;
  var secondsPerAd = 40;
  var ads = [];
  var current = 0;
  var image = document.getElementById('screen');
  function findImages(n, found, done) {
    if (n > maxAds) { done(found); return; }
    var test = new Image();
    var url = 'ad' + n + '.jpg';
    test.onload = function(){ found.push(url); findImages(n+1, found, done); };
    test.onerror = function(){ findImages(n+1, found, done); };
    test.src = url + '?check=' + Date.now();
  }
  function show(){
    if (!ads.length) return;
    image.src = ads[current] + '?v=' + Date.now();
    current = (current + 1) % ads.length;
  }
  function refreshList(){
    findImages(1, [], function(found){
      if (!found.length) return;
      var nextName = ads.length ? ads[current % ads.length] : null;
      ads = found;
      if (nextName && ads.indexOf(nextName) >= 0) current = ads.indexOf(nextName);
      else current = current % ads.length;
      if (!image.getAttribute('src')) show();
    });
  }
  refreshList();
  setInterval(show, secondsPerAd * 1000);
  setInterval(refreshList, 5 * 60 * 1000);
})();
</script>
</body>
</html>
