<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIX MOBILE - Portrait Split Screen Ads</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050a16;font-family:Arial,sans-serif;color:#fff}
#portraitCanvas{position:absolute;width:100%;height:100%;left:0;top:0;overflow:hidden;background:#050a16}
@media(min-aspect-ratio:9/16){#portraitCanvas{height:100vh;width:56.25vh;left:50%;top:0;transform:translateX(-50%)}}
@media(max-aspect-ratio:9/16){#portraitCanvas{width:100vw;height:177.77778vw;top:50%;left:0;transform:translateY(-50%)}}
#board{height:100%;width:100%;padding:0;display:flex;flex-direction:column;gap:0}
.panel{position:relative;background:#07101f;overflow:hidden}
.panel img,.panel video{display:block;width:100%;height:100%;object-fit:cover;background:#07101f}
.videoPanel{height:36%;flex:none}
.videoPanel video{object-fit:cover}
.ticker{position:relative;height:5%;flex:none;background:#0b1832;border-top:2px solid #d2a34c;overflow:hidden;white-space:nowrap}
.tickerTitle{position:absolute;left:0;top:0;height:100%;z-index:2;display:flex;align-items:center;padding:0 10px;background:#d2a34c;color:#071224;font-weight:bold;font-size:clamp(12px,1.5vh,20px)}
.tickerText{position:absolute;left:100%;top:0;height:100%;display:flex;align-items:center;font-size:clamp(13px,1.8vh,23px);white-space:nowrap;animation:scroll 38s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-180%)}}
.fixedPanel{width:100%;height:31.64%;flex:none}
.fixedPanel img{object-fit:contain}
.bottom{flex:1;min-height:0;display:flex;gap:6px;padding:6px 4px 4px}
.bottom .panel{width:50%;height:100%}
.placeholder{position:absolute;left:0;right:0;top:45%;text-align:center;color:#b7c5df;font-size:15px;pointer-events:none}
</style>
</head>
<body>
<div id="portraitCanvas"><div id="board">
 <div class="panel videoPanel"><div class="placeholder" id="videoHelp" style="display:none"></div><video id="mainVideo" muted autoplay playsinline webkit-playsinline preload="auto"></video></div>
 <div class="ticker"><div class="tickerTitle">RIX MOBILE</div><div class="tickerText">WELCOME TO RIX MOBILE PERAI MEGAMALL &nbsp; ★ &nbsp; BUKA SETIAP HARI 12PM - 9PM &nbsp; ★ &nbsp; PROMOSI TELEFON &amp; ANSURAN &nbsp; ★ &nbsp;</div></div>
 <div class="panel fixedPanel"><img id="fixedPhoto" src="fixed.jpg" alt=""></div>
 <div class="bottom"><div class="panel"><img id="adLeft" alt=""></div><div class="panel"><img id="adRight" alt=""></div></div>
</div></div>
<script>
/* CHANGE THESE SETTINGS IF NEEDED */
var secondsPerPhoto = 40;
/* All four panels use the same photo pool. Each starts at a different photo. */
var allPhotos = [];
for (var n=1;n<=20;n++){allPhotos.push('ad'+n+'.jpg');}
var photoGroups = [
 {id:'adLeft',files:allPhotos,start:0},
 {id:'adRight',files:allPhotos,start:5}
];
var videoFiles = ['video1.mp4','video2.mp4','video3.mp4'];
/* End settings */
function imagePlaylist(group){
 var element=document.getElementById(group.id), help=null, valid=[],pos=0;
 function scan(i){if(i>=group.files.length){if(valid.length){pos=group.start%valid.length;if(help)help.style.display='none';show();setInterval(show,secondsPerPhoto*1000);}return;}
  var test=new Image();test.onload=function(){valid.push(group.files[i]);scan(i+1)};test.onerror=function(){scan(i+1)};test.src=group.files[i]+'?check='+new Date().getTime();}
 function show(){if(!valid.length)return;element.src=valid[pos]+'?v='+new Date().getTime();pos=(pos+1)%valid.length;}
 scan(0);
}
for(var i=0;i<photoGroups.length;i++){imagePlaylist(photoGroups[i]);}
var video=document.getElementById('mainVideo'),videoHelp=document.getElementById('videoHelp');
var videoIndex=0,failed=0,lastTime=-1,stillCount=0,recoveries=0;
function startVideo(){
 if(failed>=videoFiles.length){failed=0;videoIndex=0;}
 video.style.display='block';
 video.src=videoFiles[videoIndex]+'?v='+new Date().getTime();
 video.load();
 var p=video.play();
 if(p&&p.catch){p.catch(function(){/* Retry automatically on watchdog */});}
 lastTime=-1;stillCount=0;
}
function advanceVideo(){failed++;videoIndex=(videoIndex+1)%videoFiles.length;recoveries=0;startVideo();}
video.onplaying=function(){videoHelp.style.display='none';failed=0;};
video.onended=function(){advanceVideo();};
video.onerror=function(){advanceVideo();};
/* Older LG webOS may freeze silently. Check actual playback progress every 15 seconds. */
setInterval(function(){
 var t=video.currentTime||0;
 if(video.ended)return;
 if(t>lastTime+0.2){lastTime=t;stillCount=0;recoveries=0;return;}
 stillCount++;
 if(stillCount>=3){
  stillCount=0;recoveries++;
  if(recoveries>=3){recoveries=0;advanceVideo();}
  else {try{video.pause();video.load();var p=video.play();if(p&&p.catch)p.catch(function(){});}catch(e){}}
 }
},15000);
startVideo();
document.getElementById("fixedPhoto").onerror=function(){this.style.display="none";};
nextVideo();
/* Reload once daily to discover newly uploaded media; do not interrupt every 5 minutes. */
setTimeout(function(){window.location.reload();},86400000);
</script>
</body>
</html>
