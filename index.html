<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIX MOBILE - Split Screen Ads</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050a16;color:white;font-family:Arial,sans-serif}#board{position:absolute;inset:0;width:100%;height:94%;display:flex;gap:8px;padding:8px}.left{width:62%;height:100%;display:flex;flex-direction:column;gap:8px}.right{width:38%;height:100%;display:flex;flex-direction:column;gap:8px}.panel{position:relative;background:#101b33;overflow:hidden;border:1px solid #24344f}.videoPanel{height:59%}.bottom{height:41%;display:flex;gap:8px}.bottom .panel{width:50%}.right .panel{height:50%}.panel img,.panel video{display:block;width:100%;height:100%;object-fit:contain;background:#070c16}.label{position:absolute;top:0;left:0;z-index:5;padding:5px 10px;background:rgba(5,12,24,.8);font-size:14px;font-weight:bold;letter-spacing:1px}.placeholder{position:absolute;left:0;right:0;top:45%;text-align:center;color:#b7c5df;font-size:21px;pointer-events:none}.ticker{position:absolute;left:0;bottom:0;width:100%;height:6%;background:#0b1832;border-top:2px solid #d2a34c;overflow:hidden;white-space:nowrap}.tickerTitle{position:absolute;left:0;top:0;height:100%;z-index:2;display:flex;align-items:center;padding:0 18px;background:#d2a34c;color:#071224;font-weight:bold;font-size:23px}.tickerText{position:absolute;left:100%;top:0;height:100%;line-height:1.8;font-size:25px;white-space:nowrap;animation:scroll 38s linear infinite}@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-180%)}}@media(max-width:600px){.label{font-size:9px}.tickerTitle{font-size:12px;padding:0 6px}.tickerText{font-size:13px}}
</style>
</head>
<body>
<div id="board">
 <div class="left">
  <div class="panel videoPanel"><div class="label">RIX MOBILE VIDEO</div><div class="placeholder" id="videoHelp">VIDEO / MP4</div><video id="mainVideo" muted autoplay playsinline webkit-playsinline preload="auto"></video></div>
  <div class="bottom">
   <div class="panel"><div class="label">PROMOTION</div><img id="adLeft" alt="Promotion"><div class="placeholder" id="helpLeft">ad1.jpg</div></div>
   <div class="panel"><div class="label">ANSURAN</div><img id="adMiddle" alt="Ansuran"><div class="placeholder" id="helpMiddle">ad5.jpg</div></div>
  </div>
 </div>
 <div class="right">
  <div class="panel"><div class="label">NEW ARRIVAL</div><img id="adRightTop" alt="New arrival"><div class="placeholder" id="helpRightTop">ad9.jpg</div></div>
  <div class="panel"><div class="label">PRICE LIST</div><img id="adRightBottom" alt="Price list"><div class="placeholder" id="helpRightBottom">ad13.jpg</div></div>
 </div>
</div>
<div class="ticker"><div class="tickerTitle">RIX MOBILE</div><div class="tickerText" id="tickerText">WELCOME TO RIX MOBILE PERAI MEGAMALL &nbsp; ★ &nbsp; BUKA SETIAP HARI 12PM - 9PM &nbsp; ★ &nbsp; PROMOSI TELEFON &amp; ANSURAN &nbsp; ★ &nbsp; WHATSAPP UNTUK MAKLUMAT LANJUT &nbsp; ★ &nbsp;</div></div>
<script>
/* CHANGE THESE SETTINGS IF NEEDED */
var secondsPerPhoto = 40;
var photoGroups = [
 {id:'adLeft',help:'helpLeft',files:['ad1.jpg','ad2.jpg','ad3.jpg','ad4.jpg']},
 {id:'adMiddle',help:'helpMiddle',files:['ad5.jpg','ad6.jpg','ad7.jpg','ad8.jpg']},
 {id:'adRightTop',help:'helpRightTop',files:['ad9.jpg','ad10.jpg','ad11.jpg','ad12.jpg']},
 {id:'adRightBottom',help:'helpRightBottom',files:['ad13.jpg','ad14.jpg','ad15.jpg','ad16.jpg','ad17.jpg','ad18.jpg','ad19.jpg','ad20.jpg']}
];
var videoFiles = ['video1.mp4','video2.mp4','video3.mp4'];
/* End settings */
function imagePlaylist(group){
 var element=document.getElementById(group.id), help=document.getElementById(group.help), valid=[],pos=0;
 function scan(i){if(i>=group.files.length){if(valid.length){help.style.display='none';show();setInterval(show,secondsPerPhoto*1000);}return;}
  var test=new Image();test.onload=function(){valid.push(group.files[i]);scan(i+1)};test.onerror=function(){scan(i+1)};test.src=group.files[i]+'?check='+new Date().getTime();}
 function show(){if(!valid.length)return;element.src=valid[pos]+'?v='+new Date().getTime();pos=(pos+1)%valid.length;}
 scan(0);
}
for(var i=0;i<photoGroups.length;i++){imagePlaylist(photoGroups[i]);}
var video=document.getElementById('mainVideo'),videoHelp=document.getElementById('videoHelp'),videoIndex=0,failed=0;
function nextVideo(){if(failed>=videoFiles.length){video.style.display='none';videoHelp.innerHTML='UPLOAD video1.mp4 (H.264 MP4)';return;}
 video.src=videoFiles[videoIndex];video.load();var promise=video.play();if(promise&&promise.catch){promise.catch(function(){videoHelp.innerHTML='VIDEO: AUTOPLAY NOT SUPPORTED';});}}
video.onplaying=function(){videoHelp.style.display='none';failed=0;};
video.onended=function(){videoIndex=(videoIndex+1)%videoFiles.length;nextVideo();};
video.onerror=function(){failed++;videoIndex=(videoIndex+1)%videoFiles.length;nextVideo();};
nextVideo();
/* Reload once daily to discover newly uploaded media; do not interrupt every 5 minutes. */
setTimeout(function(){window.location.reload();},86400000);
</script>
</body>
</html>
