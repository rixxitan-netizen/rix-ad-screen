<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RIX MOBILE - Portrait Split Screen Ads</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#050a16;color:white;font-family:Arial,sans-serif}
#board{height:100%;width:100%;padding:8px;display:flex;flex-direction:column;gap:8px}
.left{height:69%;width:100%;display:flex;flex-direction:column;gap:8px}
.videoPanel{height:49%;width:100%}.bottom{height:44%;width:100%;display:flex;gap:8px}.bottom .panel{width:50%}
.right{height:31%;width:100%;display:flex;gap:8px}.right .panel{width:50%;height:100%}
.panel{position:relative;background:#101b33;overflow:hidden;border:1px solid #24344f}
.panel img,.panel video{display:block;width:100%;height:100%;object-fit:contain;background:#070c16}
/* Fill video area without black bars; photos keep original aspect ratio. */
.videoPanel video{object-fit:cover}
.label{position:absolute;top:0;left:0;z-index:5;padding:5px 9px;background:rgba(5,12,24,.8);font-size:16px;font-weight:bold}
.placeholder{position:absolute;left:0;right:0;top:45%;text-align:center;color:#b7c5df;font-size:18px;pointer-events:none}
.ticker{position:relative;flex:0 0 7%;width:100%;height:7%;background:#0b1832;border-top:2px solid #d2a34c;overflow:hidden;white-space:nowrap}
.tickerTitle{position:absolute;left:0;top:0;height:100%;z-index:2;display:flex;align-items:center;padding:0 12px;background:#d2a34c;color:#071224;font-weight:bold;font-size:20px}
.tickerText{position:absolute;left:100%;top:0;height:100%;display:flex;align-items:center;font-size:23px;white-space:nowrap;animation:scroll 38s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-180%)}}
/* Lock the entire design to portrait 9:16, including on landscape PC browsers. */
#portraitCanvas{position:absolute;width:100%;height:100%;left:0;top:0;overflow:hidden;background:#050a16}
@media (min-aspect-ratio:9/16){#portraitCanvas{height:100vh;width:56.25vh;left:50%;top:0;transform:translateX(-50%)}}
@media (max-aspect-ratio:9/16){#portraitCanvas{width:100vw;height:177.77778vw;top:50%;left:0;transform:translateY(-50%)}}
.tickerTitle{font-size:clamp(12px,1.5vh,20px)}
.tickerText{font-size:clamp(13px,1.8vh,23px)}
.label{font-size:clamp(11px,1.3vh,16px)}
</style>
</head>
<body>
<div id="portraitCanvas">
<div id="board">
 <div class="left">
  <div class="panel videoPanel"><div class="placeholder" id="videoHelp">VIDEO / MP4</div><video id="mainVideo" muted autoplay playsinline webkit-playsinline preload="auto"></video></div>
  <div class="ticker"><div class="tickerTitle">RIX MOBILE</div><div class="tickerText" id="tickerText">WELCOME TO RIX MOBILE PERAI MEGAMALL &nbsp; ★ &nbsp; BUKA SETIAP HARI 12PM - 9PM &nbsp; ★ &nbsp; PROMOSI TELEFON &amp; ANSURAN &nbsp; ★ &nbsp; WHATSAPP UNTUK MAKLUMAT LANJUT &nbsp; ★ &nbsp;</div></div>
  <div class="bottom">
   <div class="panel"><img id="adLeft" alt=""></div>
   <div class="panel"><img id="adMiddle" alt=""></div>
  </div>
 </div>
 <div class="right">
  <div class="panel"><img id="adRightTop" alt=""></div>
  <div class="panel"><img id="adRightBottom" alt=""></div>
 </div>
</div>
</div>
<script>
/* CHANGE THESE SETTINGS IF NEEDED */
var secondsPerPhoto = 40;
/* All four panels use the same photo pool. Each starts at a different photo. */
var allPhotos = [];
for (var n=1;n<=20;n++){allPhotos.push('ad'+n+'.jpg');}
var photoGroups = [
 {id:'adLeft',files:allPhotos,start:0},
 {id:'adMiddle',files:allPhotos,start:3},
 {id:'adRightTop',files:allPhotos,start:6},
 {id:'adRightBottom',files:allPhotos,start:9}
];
var videoFiles = ['video1.mp4','video2.mp4','video3.mp4'];
/* End settings */
function imagePlaylist(group){
 var element=document.getElementById(group.id), help=null, valid=[],pos=0;
 function scan(i){if(i>=group.files.length){if(valid.length){pos=group.start%valid.length;if(help)help.style.display='none';show();setInterval(show,secondsPerPhoto*1000);}return;}
  var test=new Image();test.onload=function(){valid.push(group.files[i]);scan(i+1)};test.onerror=function(){scan(i+1)};test.src=group.files[i]+'?check='+new Date().getTime();}
 function show(){if(!valid.length)return;element.src=valid[pos]+'?v='+new Date().getTime();pos=(pos+1)%valid.length;}
 scan(0);
}
for(var i=0;i<photoGroups.length;i++){imagePlaylist(photoGroups[i]);}
var video=document.getElementById('mainVideo'),videoHelp=document.getElementById('videoHelp'),videoIndex=0,failed=0;
function nextVideo(){if(failed>=videoFiles.length){video.style.display='none';videoHelp.innerHTML='VIDEO NOT FOUND / UNSUPPORTED: check video1.mp4';return;}
 video.src=videoFiles[videoIndex];video.load();var promise=video.play();if(promise&&promise.catch){promise.catch(function(){videoHelp.innerHTML='VIDEO AUTOPLAY BLOCKED / CHECK MP4';});}}
video.oncanplay=function(){videoHelp.innerHTML="VIDEO READY - STARTING...";};
video.onplaying=function(){videoHelp.style.display='none';failed=0;};
video.onended=function(){videoIndex=(videoIndex+1)%videoFiles.length;nextVideo();};
video.onerror=function(){failed++;videoIndex=(videoIndex+1)%videoFiles.length;nextVideo();};
nextVideo();
/* Reload once daily to discover newly uploaded media; do not interrupt every 5 minutes. */
setTimeout(function(){window.location.reload();},86400000);
</script>
</body>
</html>
